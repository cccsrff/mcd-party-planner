[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mcdparty"
version = "1.0.0"
description = "麦麦派对策划师 - 基于麦当劳 MCP 的派对预订助手（1024 程序员节参赛作品）"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "孙永嘉" }]
dependencies = []

[project.scripts]
mcdparty = "mcdparty.cli:main"

[tool.setuptools.packages.find]
include = ["mcdparty*"]
